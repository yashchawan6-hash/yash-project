name: Railway Trial Expiry Reminder (3d, 2d, 1d)

on:
  schedule:
    # 06:30 UTC = 12:00 PM IST on December 2, 3, and 4
    - cron: '30 6 2,3,4 12 *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Railway Free Trial Expiry Alert (Telegram + Email Trigger)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import datetime
          import os
          import urllib.request
          import json

          ist_now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=5, minutes=30)
          expiry_date = datetime.date(2026, 12, 5)
          days_left = (expiry_date - ist_now.date()).days

          if days_left in (1, 2, 3) or os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              day_label = f"{days_left} DAY{'S' if days_left != 1 else ''} LEFT" if days_left > 0 else f"TEST REMINDER ({days_left} days until Dec 5, 2026)"
              msg = (
                  f"⏰ <b>RAILWAY FREE TRIAL REMINDER — {day_label}!</b> ⏰\n\n"
                  f"• <b>Account:</b> yashchawan6@gmail.com\n"
                  f"• <b>Service:</b> parcel-tracker (https://parcel-tracker-production-73f3.up.railway.app)\n"
                  f"• <b>Trial Expiry Date:</b> 05 Dec 2026\n"
                  f"• <b>Days Remaining:</b> <b>{days_left} day(s)</b>\n\n"
                  f"💡 <b>Action Required:</b> Upgrade to the <b>$5/month Hobby Plan</b> before 05 Dec 2026 so your Parcel Tracker, Telegram Bot (@PARCELDULHAN_BOT), and DTDC auto-sync continue running 24/7 without interruption.\n\n"
                  f"🔗 <a href='https://railway.com/workspace/billing'>Open Railway Billing & Upgrade</a>"
              )

              bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID")
              if bot_token and chat_id:
                  url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                  data = json.dumps({"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}).encode("utf-8")
                  req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      print("Telegram reminder sent:", resp.status)
          EOF
